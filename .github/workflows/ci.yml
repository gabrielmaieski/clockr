name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  docker:
    name: Build e smoke test do Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t clockr:ci .
      - name: Sobe o container
        run: docker run -d --name clockr -p 3000:3000 -e ADMIN_PASSWORD=ci-senha-forte-123 clockr:ci
      - name: Verifica a API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs clockr
          exit 1
      - name: Confere cabeçalhos de segurança
        run: |
          headers=$(curl -fsSI http://localhost:3000/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
      - name: Recusa subir sem ADMIN_PASSWORD
        run: |
          set +e
          timeout 30 docker run --rm clockr:ci
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "Esperado código 1 (erro de configuração), recebido $code"; exit 1
          fi
